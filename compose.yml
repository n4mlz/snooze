name: snooze

services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.1
    container_name: snooze-docker-socket-proxy
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      POST: "0"
      VERSION: "1"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      docker-socket:
        aliases:
          - docker-socket-proxy
    restart: unless-stopped

  db:
    image: mariadb:11.6
    container_name: snooze-db
    env_file:
      - ${ENV_DIR:-env/dev}/db.env
    volumes:
      - ./sns-backend/sql_init:/docker-entrypoint-initdb.d:ro
      - ./sns-backend/sql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD"]
      timeout: 5s
      interval: 5s
      retries: 10
    restart: unless-stopped

  db-monitor-init:
    image: mariadb:11.6
    container_name: snooze-db-monitor-init
    env_file:
      - ${ENV_DIR:-env/dev}/db.env
      - ${ENV_DIR:-env/dev}/mysqld-exporter.env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/mysqld-exporter/db-monitor-init.sh"]
    volumes:
      - ./monitoring/db-monitor-init.sh:/etc/mysqld-exporter/db-monitor-init.sh:ro
    restart: "no"

  traefik:
    image: traefik:v3.7.1
    container_name: snooze-traefik
    command:
      - --providers.docker.exposedByDefault=false
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --entryPoints.web.address=:80
      - --entryPoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
    ports:
      - "80:80"
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks:
      - default
      - docker-socket
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: snooze-prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: snooze-grafana
    env_file:
      - ${ENV_DIR:-env/dev}/infra.env
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${METRICS_DASHBOARD_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: snooze-alertmanager
    env_file:
      - ${ENV_DIR:-env/dev}/infra.env
    volumes:
      - ./alertmanager/runtime.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: snooze-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: snooze-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki
      - docker-socket-proxy
    networks:
      - default
      - docker-socket
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: snooze-blackbox-exporter
    volumes:
      - ./prometheus/blackbox.yml:/config/blackbox.yml:ro
    command: ["--config.file=/config/blackbox.yml"]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: snooze-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: snooze-mysqld-exporter
    env_file:
      - ${ENV_DIR:-env/dev}/mysqld-exporter.env
    entrypoint: ["/bin/sh", "/etc/mysqld-exporter/entrypoint.sh"]
    volumes:
      - ./monitoring/mysqld-exporter-entrypoint.sh:/etc/mysqld-exporter/entrypoint.sh:ro
    depends_on:
      db-monitor-init:
        condition: service_completed_successfully
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: snooze-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    restart: unless-stopped

networks:
  default:
    name: sns-network
  docker-socket:
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:
