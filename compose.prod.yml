services:
  db:
    restart: always

  traefik:
    restart: always

  prometheus:
    restart: always

  grafana:
    restart: always

  node-exporter:
    restart: always

  db-monitor-init:
    restart: "no"

  alertmanager:
    restart: always

  blackbox-exporter:
    restart: always

  mysqld-exporter:
    restart: always

  backend:
    image: ${BACKEND_IMAGE}
    container_name: snooze-backend
    env_file:
      - ${ENV_DIR:-env/prod}/backend.env
    volumes:
      - ./sns-backend/serviceAccountKey.json:/serviceAccountKey.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: always

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: snooze-frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: always
