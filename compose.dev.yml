services:
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"

  backend:
    image: golang:1.27
    container_name: snooze-backend
    working_dir: /go/app
    env_file:
      - ${ENV_DIR:-env/dev}/backend.env
    ports:
      - "8080:8080"
    command: ["go", "run", "."]
    volumes:
      - ./sns-backend:/go/app
      - ./sns-backend/serviceAccountKey.json:/go/app/serviceAccountKey.json:ro
      - go_pkg_cache:/go/pkg
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: snooze-frontend
    working_dir: /app
    env_file:
      - ${ENV_DIR:-env/dev}/frontend.env
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev"]
    volumes:
      - ./sns-frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  go_pkg_cache:
  frontend_node_modules:
