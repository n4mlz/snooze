http:
  middlewares:
    api-rate-limit:
      rateLimit:
        average: 120
        period: 1m
        burst: 30

  routers:
    backend:
      entryPoints:
        - web
      rule: PathPrefix(`/api`)
      priority: 100
      service: backend
      middlewares:
        - api-rate-limit

    frontend:
      entryPoints:
        - web
      rule: PathPrefix(`/`)
      priority: 10
      service: frontend

  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8080

    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
